<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #000000; }
  * { box-sizing: border-box; }
  a { color: #0000FF; text-decoration: none; }
  a:hover { color: #FFFFFF; }
  ::selection { background: #0000FF; color: #FFFFFF; }
</style>
</helmet>
<div ref="{{ scroller }}" style="position:relative; height:100vh; overflow-y:auto; overflow-x:hidden; background:#000000; font-family:Archivo, 'Helvetica Neue', sans-serif; -webkit-font-smoothing:antialiased">
  <div style="position:sticky; top:0; height:100vh; width:100%; overflow:hidden; background:#000000">
    <div ref="{{ stage }}" style="position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:50% 50%; transform:translate(-50%,-50%)">

      <div ref="{{ symbol }}" style="position:absolute; left:786px; top:425px; width:347px; height:230px; will-change:transform">
        <svg ref="{{ fragA }}" viewBox="155 130 1155 760" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible; will-change:transform">
          <polygon points="430,255 660,255 752,347 637,463" fill="{{ accent }}"></polygon>
        </svg>
        <svg ref="{{ fragB }}" viewBox="155 130 1155 760" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible; will-change:transform">
          <polygon points="995,138 1300,138 800,625 665,465" fill="{{ accent }}"></polygon>
        </svg>
        <svg ref="{{ fragC }}" viewBox="155 130 1155 760" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible; will-change:transform">
          <polygon points="555,490 700,630 443,881 162,881" fill="{{ accent }}"></polygon>
        </svg>
        <svg ref="{{ fragD }}" viewBox="155 130 1155 760" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible; will-change:transform">
          <polygon points="705,635 905,835 700,835 610,745" fill="{{ accent }}"></polygon>
        </svg>
        <svg ref="{{ fragE }}" viewBox="155 130 1155 760" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible; will-change:transform">
          <polygon points="948,590 1210,850 1027,850 855,678" fill="{{ accent }}"></polygon>
        </svg>
        <svg ref="{{ ring }}" viewBox="-200 -200 400 400" style="position:absolute; left:50%; top:50%; width:900px; height:900px; margin:-450px 0 0 -450px; overflow:visible; opacity:0; pointer-events:none">
          <circle cx="0" cy="0" r="110" fill="none" stroke="{{ accent }}" stroke-width="1.4"></circle>
        </svg>
      </div>

      <img ref="{{ wordmark }}" src="assets/rixza-wordmark.png" alt="RIXZA" style="position:absolute; left:788px; top:479px; width:736px; height:136px; clip-path:inset(0% 100% 0% 0%)" />

      <div ref="{{ tagline }}" style="position:absolute; left:0; right:0; top:760px; text-align:center; color:#FFFFFF; font-size:19px; font-weight:500; letter-spacing:0.42em; opacity:0">CONVERGENCE. TRANSFORMATION. MOMENTUM.</div>

      <div ref="{{ labA }}" style="position:absolute; left:340px; top:105px; transform:translate(-50%,-50%); color:#FFFFFF; font-size:15px; font-weight:500; letter-spacing:0.4em; white-space:nowrap">STRATEGY</div>
      <div ref="{{ labB }}" style="position:absolute; left:1600px; top:105px; transform:translate(-50%,-50%); color:#FFFFFF; font-size:15px; font-weight:500; letter-spacing:0.4em; white-space:nowrap">TECHNOLOGY</div>
      <div ref="{{ labC }}" style="position:absolute; left:300px; top:745px; transform:translate(-50%,-50%); color:#FFFFFF; font-size:15px; font-weight:500; letter-spacing:0.4em; white-space:nowrap">EXECUTION</div>
      <div ref="{{ labD }}" style="position:absolute; left:1560px; top:745px; transform:translate(-50%,-50%); color:#FFFFFF; font-size:15px; font-weight:500; letter-spacing:0.4em; white-space:nowrap">PERFORMANCE</div>

      <div ref="{{ hint }}" style="position:absolute; left:0; right:0; bottom:52px; text-align:center; color:#FFFFFF; font-size:12px; font-weight:400; letter-spacing:0.55em; opacity:0.45">SCROLL</div>
    </div>

    <div ref="{{ controls }}" style="position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:18px; padding:16px 22px; background:#000000; border-top:1px solid #141414">
      <div onClick="{{ togglePlay }}" ref="{{ playBtn }}" style="cursor:pointer; user-select:none; color:#FFFFFF; font-size:11px; font-weight:500; letter-spacing:0.3em; padding:8px 14px; border:1px solid #262626" style-hover="border-color:#0000FF">PLAY</div>
      <input ref="{{ slider }}" type="range" min="0" max="1000" step="1" onInput="{{ onScrub }}" style="flex:1; accent-color:#0000FF; background:transparent" />
      <div ref="{{ readout }}" style="color:#FFFFFF; opacity:0.5; font-size:11px; font-weight:400; letter-spacing:0.22em; font-variant-numeric:tabular-nums; min-width:132px; text-align:right">0.00s · 0%</div>
    </div>
  </div>
  <div ref="{{ spacer }}" style="height:420vh"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0000FF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0000FF&quot;,&quot;#1B2BFF&quot;,&quot;#0033CC&quot;],&quot;section&quot;:&quot;Brand&quot;},&quot;showLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showTagline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showControls&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;scrollLength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.2,&quot;min&quot;:2,&quot;max&quot;:8,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;×vh&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;spread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.6,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;pulseIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  r = {};
  p = 0;
  playing = false;

  renderVals() {
    const R = {
      accent: this.props.accentColor ?? '#0000FF',
      togglePlay: () => this.togglePlay(),
      onScrub: e => {
        const v = +e.target.value / 1000;
        this.stop();
        this.setScroll(v);
      }
    };
    ['scroller','stage','symbol','fragA','fragB','fragC','fragD','fragE','ring','wordmark','tagline','labA','labB','labC','labD','hint','controls','slider','readout','playBtn','spacer'].forEach(k => {
      R[k] = el => { this.r[k] = el; };
    });
    return R;
  }

  componentDidMount() {
    try { this.embedded = window.self !== window.top; } catch (e) { this.embedded = true; }
    this.onScroll = () => { if (!this.playing) this.p = this.scrollProgress(); this.draw(); };
    this.onResize = () => { this.fit(); this.draw(); };
    this.r.scroller.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.fit();
    this.p = this.scrollProgress();
    this.draw();
    if (this.embedded) this.play();
  }

  componentDidUpdate() { this.fit(); this.draw(); }

  componentWillUnmount() {
    this.r.scroller && this.r.scroller.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    this.stop();
  }

  fit() {
    const host = this.r.scroller;
    if (!host || !this.r.stage) return;
    const w = host.clientWidth, h = host.clientHeight;
    const s = Math.min(w / 1920, h / 1080);
    this.r.stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    if (this.r.spacer) this.r.spacer.style.height = (this.props.scrollLength ?? 4.2) * 100 + 'vh';
    if (this.r.controls) this.r.controls.style.display = (!this.embedded && (this.props.showControls ?? true)) ? 'flex' : 'none';
  }

  scrollProgress() {
    const el = this.r.scroller;
    const max = el.scrollHeight - el.clientHeight;
    return max <= 0 ? 0 : Math.max(0, Math.min(1, el.scrollTop / max));
  }

  setScroll(v) {
    const el = this.r.scroller;
    const max = el.scrollHeight - el.clientHeight;
    el.scrollTop = v * max;
    this.p = v;
    this.draw();
  }

  togglePlay() { this.playing ? this.stop() : this.play(); }

  play() {
    this.playing = true;
    if (this.r.playBtn) this.r.playBtn.textContent = 'PAUSE';
    const from = this.p >= 0.999 ? 0 : this.p;
    const t0 = performance.now() - from * 5000;
    const tick = () => {
      if (!this.playing) return;
      const v = Math.min(1, (performance.now() - t0) / 5000);
      this.setScroll(v);
      if (v >= 1) {
        if (this.embedded) {
          this.playing = false;
          this.loopTimer = setTimeout(() => { this.play(); }, 1200);
          return;
        }
        this.stop();
        return;
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  stop() {
    this.playing = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.loopTimer) { clearTimeout(this.loopTimer); this.loopTimer = null; }
    if (this.r.playBtn) this.r.playBtn.textContent = 'PLAY';
  }

  draw() {
    const r = this.r;
    if (!r.symbol) return;
    const p = this.p;
    const cl = v => Math.max(0, Math.min(1, v));
    const seg = (a, b) => cl((p - a) / (b - a));
    const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const out = t => 1 - Math.pow(1 - t, 3);
    const pulse = this.props.pulseIntensity ?? 1;
    const spread = this.props.spread ?? 1;

    // four forces converge; all locked at 85%
    const groups = [
      ['fragA', -500, -280, 0.08],
      ['fragB',  520, -300, 0.05],
      ['fragC', -520,  270, 0.11],
      ['fragD',  430,  290, 0.14],
      ['fragE',  570,  270, 0.14]
    ];
    groups.forEach(([k, dx, dy, t0]) => {
      const e = ease(seg(t0, 0.85));
      const f = (1 - e) * spread;
      if (r[k]) r[k].style.transform = 'translate3d(' + (dx * f).toFixed(3) + 'px,' + (dy * f).toFixed(3) + 'px,0)';
    });

    // X expands into the full identity
    const shift = -387 * ease(seg(0.86, 0.93));
    r.symbol.style.transform = 'translate3d(' + shift.toFixed(2) + 'px,0,0)';

    const g = pulse * Math.sin(Math.PI * seg(0.79, 0.96));
    r.symbol.style.filter = g > 0.01 ? 'drop-shadow(0 0 ' + (20 * g).toFixed(1) + 'px rgba(0,0,255,' + (0.55 * g).toFixed(3) + '))' : 'none';

    const k = seg(0.835, 0.9);
    if (r.ring) {
      const sc = 0.3 + 0.85 * out(k);
      r.ring.style.opacity = k > 0 && k < 1 ? (0.32 * pulse * Math.pow(1 - k, 1.8)).toFixed(3) : 0;
      r.ring.style.transform = 'scale(' + sc.toFixed(3) + ')';
    }

    if (r.wordmark) r.wordmark.style.clipPath = 'inset(0% ' + (100 - 100 * ease(seg(0.915, 0.995))).toFixed(2) + '% 0% 0%)';
    if (r.tagline) r.tagline.style.opacity = ((this.props.showTagline ?? true) ? seg(0.955, 1) : 0).toFixed(3);

    const lab = (this.props.showLabels ?? true) ? (1 - seg(0.16, 0.42)) : 0;
    const fade = Math.min(seg(0, 0.03) === 0 ? 1 : 1, 1);
    ['labA', 'labB', 'labC', 'labD'].forEach(n => { if (r[n]) r[n].style.opacity = (lab * 0.72 * fade).toFixed(3); });
    if (r.hint) r.hint.style.opacity = (0.45 * (1 - seg(0, 0.035))).toFixed(3);
    if (r.readout) r.readout.textContent = (p * 5).toFixed(2) + 's · ' + Math.round(p * 100) + '%';
    if (r.slider && document.activeElement !== r.slider) r.slider.value = Math.round(p * 1000);
  }
}

</script>
</body>
</html>
